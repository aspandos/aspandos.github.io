    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Invoice IDP &amp; RPA</h1><p>A local model reads the invoice, rules check it, a robot types it into the ERP</p><p>An invoice process has to read a PDF, stop the invoices that are wrong, and get the rest into an accounting system that may have no API. This demo does all three on Camunda 8 Run, on one PC, with a local model and made-up invoices. On 16 held-out synthetic invoices (SYNTHETIC, n = 16) the local model read 175 of 176 fields, and a rules-based extractor 122. The one field it got wrong, an IBAN wrapped across two lines, failed its check digits, so the invoice would have gone to a person. Building the demo turned up a bug in Camunda's AI Agent connector: I reported it, and the fix has been merged into Camunda's connectors.</p><p>A Camunda 8 demo on my PC, on made-up invoices. A local LLM reads each supplier invoice, a DMN table decides which ones need a person, the reviewer works in Tasklist, and a Robot Framework robot types the approved ones into a mock terminal ERP. AI agents wrote the code under my direction.</p><h2>How it works</h2><p>Each invoice runs through one BPMN process on Camunda 8 Run 8.10.9. A Python job worker takes the PDF's text layer and asks Gemma 4 12B, running in llama.cpp on my PC's graphics card, for the fields against a JSON schema. If the model fails, a rules-based extractor answers instead and the invoice goes to a person. A scan, a PDF with no text layer, goes straight to a person because there is no OCR.</p><p>Code then checks every field the model returns: is the value in the document text, do the VAT ID and the IBAN pass their check digits, and does the rules-based extractor read the same? Each failed check lowers the field's score, and the invoice's confidence is its lowest field score.</p><p>A DMN table with 11 rules collects every reason to stop an invoice: confidence under 0.8, a VAT rate the supplier's country doesn't use, VAT or totals that don't add up, a vendor missing from the vendor master, an IBAN that differs from the account on file, a total above 250 000 CZK, a due date before the issue date, and missing fields. Above the approval limit the review goes to finance managers instead of clerks.</p><p>The Tasklist form shows why the invoice stopped, the PDF and the extracted fields to correct. A Robot Framework script then types each approved invoice into ERP/400, a mock terminal ERP reached over Telnet, which refuses unbalanced amounts and duplicate invoices. The same script ran in my Python worker and on Camunda's RPA worker 1.3.2. When a reviewer rejects an invoice because its bank account changed, Camunda's AI Agent connector drafts a query to the supplier on the local model; a person edits and approves it, and it is stored, never sent (SIMULATED).</p><p>Every figure here is SYNTHETIC. The prompt and the rules were tuned on 24 dev invoices in four layouts. The test set of 16 invoices was generated after the extractor was frozen, and two of its six layouts appear nowhere else. On it (SYNTHETIC, n = 16), Gemma got 175 of 176 fields and 15 of 16 invoices fully right; the rules-based extractor got 122 of 176 fields and 8 of 16 invoices. Gemma's one miss was an IBAN wrapped across two lines: it failed its check digits, scored 0.09 and would have sent the invoice to a person.</p><p>A second process rebuilds the support triage of my AI Toolbox demo in Camunda, with Camunda's AI Agent connector calling the toolbox's tools over MCP (SIMULATED: a made-up shop, nothing sent). In those runs the AI Agent's job failed when the model put a JSON null in a tool call's arguments, and a retry repeated the failure. I reported it as issue 10533 with a repro against a mock model. AI agents wrote the fix and its tests under my direction, and it was merged into Camunda's connectors on 18 Nov 2026 as pull request 10540.</p><h2>Limits and decisions</h2><ul><li><strong>Made-up invoices, not a benchmark.</strong> Every invoice is synthetic, and the same AI agent wrote the invoices, the extractors' settings and the evals. The figures show that the pipeline works on these layouts. Sixteen test invoices are too few to say more.</li><li><strong>Correct invoices get stopped too.</strong> The score sends some correctly read invoices to a person. On the test set (SYNTHETIC, n = 16) that happened to the four Slovak invoices: the rules-based extractor misread the supplier's name there, and the disagreement pulled the score under 0.8.</li><li><strong>Scans are not read.</strong> A PDF without a text layer goes straight to a person, because there is no OCR. A print-and-scan set is prepared, and no extractor has run on it yet.</li><li><strong>A mock ERP, on one PC.</strong> ERP/400 is a terminal screen written for this demo; the robot has never typed into a real ERP. Everything runs on my PC, with no login on the local API and a fixed demo EUR/CZK rate (24.30). In the unattended runs a script did most of the reviews; two were done in Tasklist's form.</li><li><strong>No live version, no Camunda screens.</strong> Camunda 8 Run is under Camunda's Self-Managed Non-Production Terms, so the demo runs only on my PC. The pictures on this page were made for it from the project's files; none of them is a screenshot of Camunda's own screens.</li><li><strong>The demo predates the fix.</strong> The fix shipped in Camunda's connectors 8.10.7, a stable release of 23 Nov 2026. The demo was built earlier, on a version with the bug, so it works around it: its tool fields that may be empty are offered as strings.</li><li><strong>Not tested.</strong> Scans; the AI Agent connector with a cloud model; more than one user, a real login, or more than 7 invoices per run; and, in the triage twin, the cloud route, the live toolbox server, more than three runs per setting and a person reading all 36 reply drafts.</li></ul><h2>What's inside</h2><ul><li>One BPMN process on Camunda 8 Run 8.10.9 on my PC</li><li>Every field is checked by code</li><li>On 16 held-out synthetic invoices (SYNTHETIC, n = 16)</li><li>A Robot Framework script types each approved invoice into ERP/400, a mock terminal ERP with no…</li><li>A bug found in the demo, a JSON null in a tool call's arguments failing the AI Agent connector's…</li></ul><p>Built with: Camunda 8, Python, llama.cpp, Robot Framework, Claude Code</p><p><a href="/work/portfolio-site/">Previous project: Portfolio HQ</a> · <a href="/work/lead-intake/">Next project: Lead Intake</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Invoice%20IDP%20%26%20RPA">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
