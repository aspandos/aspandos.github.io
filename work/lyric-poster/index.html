    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Lyric Poster</h1><p>Song in, Swiss-poster lyric reel out, every word frame-exact</p><p>A TouchDesigner tool that turns a song, timed lyrics and oil paintings into a 60 fps Swiss-poster lyric reel. Solo concept and direction, code by AI agents; two reels, every word frame-exact.</p><p>A reusable TouchDesigner tool: give it a song, its timed lyrics and a folder of public-domain oil paintings, and it renders a 1080×1920, 60 fps lyric reel in Swiss-poster style (4:5, 1:1 and 16:9 layouts too). Offline numpy analysis builds a drift-corrected beat grid, a per-song JSON plan directs every section, and each frame composites a depth-relief ASCII painting world with a shader-drawn Anton type layer that re-flows on the beat. Automated QC proves the timing: in the two delivered reels, 168 of 168 and 41 of 41 words appear on their exact start frame.</p><h2>What's inside</h2><ul><li>The whole 85-operator network is generated from Python</li><li>Audio analysis in numpy</li><li>Type engine (1,894 lines) with 21 poster layout templates (giant, knock-out, cut-out, vertical…</li><li>World shaders</li><li>Render and QC pipeline</li></ul><p>Built with: TouchDesigner, Python, GLSL, FFmpeg, Whisper, Demucs, Depth Anything, PowerShell</p><p><a href="/work/liquid/">Previous project: Liquid / Obsidian Bloom</a> · <a href="/work/anima/">Next project: Anima</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Lyric%20Poster">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
