    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Two CRM campaigns: one simulated, one real</h1><p>A simulated bank campaign in SQL and Mautic, measured against a group that got no message, and my real job letters sent through Mautic and my own mail server.</p><h2>Dashboard</h2><p>Job Outreach (REAL DATA, n = 10, read on 2026-11-12): 10 letters sent, 10 accepted by the receiving server, 1 reply from people, 0 clicks by people (3 raw hits before the scanner filter). Counts, never rates: there are too few letters for any conclusion. Opens are not counted, because the letters carry no tracking pixel.</p><p>CRM Campaign (SIMULATED DATA, run 2, 2000 synthetic clients): 1700 chosen by the SQL rule, 9 of 9 safety checks passed; savings account within 30 days: holdout 5 of 163, framing A 13 of 754, framing B 10 of 783. Neither the campaign against the holdout nor A against B is shown: both intervals include zero, and the holdout group is too small for the small effect the simulation gives. No winner is picked.</p><ul><li><a href="/work/crm-campaign/">CRM Campaign</a> (Simulated data): A bank campaign, from choosing the clients to measuring the result. A fictional bank and synthetic clients, so no message reached a real person. No winner: the first run was inconclusive, and both readings of run 2 are “not shown”.</li><li><a href="/work/job-outreach/">Job Outreach</a> (Real data): Job letters from my own mail server, measured without a pixel. Real recipients, and no company is named. No tracking pixel: clicks go through my own redirect, which every letter discloses.</li></ul><h2>Limits</h2><ul><li><strong>Simulated, not a real campaign.</strong> In CRM Campaign the bank is made up, the clients are synthetic, and their behaviour comes from a simulator. The runs show the method and the machinery; they say nothing about how real clients behave.</li><li><strong>Few letters, no conclusions.</strong> Job Outreach reports counts with their date, never rates, and says nothing about which letter, subject line or kind of company works better.</li><li><strong>Mautic is a stand-in.</strong> Mautic is an open-source stand-in, neither Bloomreach nor Salesforce Marketing Cloud Engagement, and I have no production experience with any of the three.</li></ul><p>AI agents (Claude Code) collected the target companies and wrote the code, the SQL, the letter drafts and the first versions of the texts under my direction. In CRM Campaign I chose the campaign idea, the target rule and the A/B hypothesis from options the agents proposed; in Job Outreach each batch of letters went out only after my yes.</p><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%20enquiry">Write email</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%20enquiry">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
