    <noscript><h1>Procedural Shuffle</h1><p>Dance research compiled to Control Rig keys, no mocap</p><p>Procedural Shuffle animates the Melbourne shuffle without motion capture or manual keying in the editor. A 27 KB technique brief reconciled from cited sources (STEEZY, Howcast and others) feeds a Python generator that writes a seamlessly looping 16-count combo of Running Man and T-steps in both directions, and a compiled script keys it onto Epic's Manny through Control Rig in a UE5 Level Sequence via the editor's MCP server. The same spec drives a standalone Python 2D renderer whose frames are packed into sprite atlases and played back by a flipbook material in a Movie Render Queue render: one source of truth, two renderers.</p></noscript>
