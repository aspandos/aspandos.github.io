    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Triad</h1><p>One music analysis, three apps, every frame in sync.</p><p>Audio-reactive pipeline: one Python music analyzer drives TouchDesigner live, plus frame-exact Houdini simulations and Unreal renders. Designed and directed by Aspandiyar, coded with an AI agent. Result: two 30-second shots.</p><p>Triad is a pipeline I designed so TouchDesigner, Houdini and Unreal Engine 5.8 react to the same music. One Python analyzer runs live in TouchDesigner, which streams 65 OSC channels per frame (a 32-bin spectrum among them) into a custom Unreal C++ plugin; offline, the same code writes frame-exact 'takes' that drive Houdini simulations and Unreal renders. Two shots prove it: Endless Blossom, a procedural lotus that grows a petal on every beat and sheds a wave of Vellum-cloth petals on the drop, rendered from one Alembic in both Karma XPU and Unreal; and Sand Reformation, 250,126 Vellum grains poured on the kicks and played back in Unreal as GPU instances.</p><h2>What's inside</h2><ul><li>One causal numpy analyzer (470 lines) runs live in a TouchDesigner Script CHOP and offline at 48x…</li><li>TriadLink, a ~2,000-line Unreal Engine 5.8 C++ plugin</li><li>Endless Blossom</li><li>Sand Reformation</li><li>The TouchDesigner conductor builds itself from Python</li></ul><p>Built with: TouchDesigner, Houdini, Unreal Engine 5, C++, Python, OSC, Karma, VEX, HLSL, GLSL, NDI, Demucs, FFmpeg, PowerShell</p><p><a href="/work/anima/">Previous project: Anima</a> · <a href="/work/av-control/">Next project: AV Control</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Triad">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
