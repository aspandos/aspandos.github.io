    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Anima</h1><p>A flower that hears music: 262,144 GPU particles</p><p>Music-reactive TouchDesigner piece: a flower photo dissolves into 262,144 particles; kicks, drops, voice and melody drive separate layers. Solo concept and direction, code written with AI agents; result: a 60-second reel.</p><p>Anima is a vertical 1080×1920, 60 fps music-reactive TouchDesigner piece: a real flower photo stays sharp only in selected cells of an 8×14 grid and everywhere else dissolves into hair, strands and dust from a 262,144-particle GPU simulation. Kicks, drops, vocals and the lead melody each drive their own layer, from live FFT detection in Python plus offline Demucs stem curves, while a virtual relief camera films the result through a Depth Anything V2 depth map. The whole network is generated from Python every time a 946-byte bootstrap .toe opens, it can be played live on an Xbox controller, and the 60 s reel was rendered offline frame by frame.</p><h2>What's inside</h2><ul><li>GPU simulation of 262,144 particles (a 512×512 rgba32float state fed back through a GLSL TOP every…</li><li>Depth-relief camera in a single fragment shader</li><li>Two-layer music analysis</li><li>Network as code</li><li>Built to perform and to ship</li></ul><p>Built with: TouchDesigner, GLSL, Python, Demucs, Depth Anything, PyTorch</p><p><a href="/work/lyric-poster/">Previous project: Lyric Poster</a> · <a href="/work/triad/">Next project: Triad</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Anima">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
