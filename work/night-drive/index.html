    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Undercover Ecstasy</h1><p>Every cut, arch and word locked to the music</p><p>A 30-second vertical night-drive reel from UE5, cut on the beat, with word-synced neon lyrics. Concept, look and shot choices are mine; AI coding agents wrote the code. Result: reproducible, frame-checked render.</p><p>A 30-second vertical night-drive reel rendered from my own audio-reactive Unreal Engine 5 world: a white coupé drives under light arches that pulse with the music, across 17 shots cut on the song's 129 BPM grid. A C++ record mode steps the engine at a fixed 1/30 s and feeds the song to the analyzer by game time, so the same JSON shot list gives the same drive, cameras and per-frame log on every render. A Python text pass lights neon lyrics word by word from Whisper-aligned vocal timing, and two frame-measured reviews of v1 led to a documented v2.</p><h2>What's inside</h2><ul><li>Deterministic C++ record mode</li><li>The music sets the picture</li><li>Lyric-sync pipeline</li><li>Frame-measured QA over all 900 frames (P90 luminance of the projected car box, cam-to-car…</li><li>One-command pipeline (make_reel.ps1)</li></ul><p>Built with: Unreal Engine 5, C++, Python, Demucs, Whisper, FFmpeg, PowerShell</p><p><a href="/work/banana-heaven/">Previous project: Banana Party in Heaven</a> · <a href="/work/fish-weather/">Next project: Fish Weather</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Undercover%20Ecstasy">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
