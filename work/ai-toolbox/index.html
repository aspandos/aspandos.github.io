made-up e-shop: a gateway keeps e-mails with detected personal details on a model in the PC and sends the rest to Claude, with team budgets, an MCP server and an eval.","genre":"AI tools · Local LLM · MCP","dateCreated":"2026","inLanguage":"en","keywords":["Claude API","MCP","llama.cpp","Python","Claude Code"],"image":{"@id":"https://aspandos.com/work/ai-toolbox/#image"},"creator":{"@type":"Person","@id":"https://aspandos.com/#person","name":"Aspandiyar Kurman","url":"https://aspandos.com/"}},{"@type":"ImageObject","@id":"https://aspandos.com/work/ai-toolbox/#image","url":"https://aspandos.com/media/ai-toolbox/og.jpg","contentUrl":"https://aspandos.com/media/ai-toolbox/og.jpg","width":1200,"height":630,"caption":"E-mails with detected personal details go only to a local model"},{"@type":"BreadcrumbList","@id":"https://aspandos.com/work/ai-toolbox/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Work","item":"https://aspandos.com/work/"},{"@type":"ListItem","position":2,"name":"AI Toolbox"}]}]}</script>

    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>AI Toolbox</h1><p>E-mails with detected personal details go only to a local model</p><p>A company that gives its teams AI tools needs to know which tool may see which data, what it costs and whether it does the job. This demo answers that for the support team of a made-up e-shop. E-mails with detected personal details go only to a model on my PC; the rest go to Claude within the team's monthly budget. On 36 test e-mails graded by code, Claude got 36 right and the local model 32, so every draft still waits for a person. It also compares real AI tools for a made-up firm and turns meeting recordings into notes on the PC.</p><ul><li><strong>36 / 36</strong> test e-mails right on Claude. Claude Opus 5.5 and Haiku 5.5, each on 36 made-up Czech support e-mails graded by code.</li><li><strong>32 / 36</strong> the same e-mails on the local model. Gemma 4 12B on my PC: 88.9 %, under the registry's 90 % rule. A person checks every draft.</li><li><strong>35 / 36</strong> decisions right, bigger local model. gpt-oss-120b, same 36 e-mails, separate lab, one run. 33 fully right; median 33.7 s per e-mail.</li><li><strong>13 / 16</strong> action items found in meeting notes. Whisper and Gemma 4 12B on my PC. Three made-up Czech meetings and one real English one.</li></ul><p>Graded by code against expected answers, not by people. The same AI agent wrote the system and the test e-mails, so this is not an independent test. The limits are listed further down.</p><p>A demo AI toolbox for a made-up e-shop: a gateway keeps e-mails with detected personal details on a model in the PC and sends the rest to Claude, with team budgets, an MCP server and an eval.</p><h2>How it works</h2><h3>Routing by data class</h3><p>Before the first model call, the gateway sorts each e-mail into personal, internal or public data. Personal goes only to Gemma 4 12B on my PC's graphics card; internal and public go to the team's Claude model while its monthly budget lasts. If a tool result in a cloud run turns out to hold personal details, the run stops and the e-mail runs again locally.</p><h3>One MCP server for the tools</h3><p>One MCP server gives each team only the tools the registry allows: find an order, search and read the wiki, open a ticket, check its status. It logs every call, refused or not, with personal details replaced by their kind.</p><h3>The support agent and the draft check</h3><p>The agent reads one e-mail, looks up the order, finds the rule in the wiki, picks one of 13 decisions and opens a ticket where the wiki asks for one. Code checks the draft (the decision, the cited paragraphs, every date and number, no request for a card or password by e-mail) and sends a failed one back once. Nothing goes to a customer: drafts and tickets wait for a person.</p><h3>The eval: Claude 36 of 36, the local model 32</h3><p>36 made-up Czech test e-mails, graded by code. Claude Opus 5.5 and Haiku 5.5 got 36/36. Gemma 4 12B got 32/36 (88.9 %), under the registry's 90 % rule. The gateway as support would use it, personal e-mails on Gemma and the rest on Opus, got 33/36.</p><table><caption>Eval of 11 Nov: e-mails right out of 36 and the cost per e-mail. Both local models run on my PC.</caption><thead><tr><th scope="col">Who answered</th><th scope="col">Right</th><th scope="col">Per e-mail</th></tr></thead><tbody><tr><th scope="row">Claude Opus 5.5</th><td>36/36</td><td>$0.0183</td></tr><tr><th scope="row">Claude Haiku 5.5</th><td>36/36</td><td>$0.0006</td></tr><tr><th scope="row">Gateway: personal e-mails on Gemma, the rest on Opus</th><td>33/36</td><td>$0.0073</td></tr><tr><th scope="row">Gemma 4 12B, local</th><td>32/36 (88.9 %)</td><td>local</td></tr><tr><th scope="row">gpt-oss-20b, local; 28 decisions right (77.8 %)</th><td>26/36</td><td>local</td></tr></tbody></table><h3>The registry: what is approved</h3><p>One file lists each tool's status, the data it may see, its licence, cost and the evidence behind it. By its own rule Opus and Haiku are approved and gpt-oss-20b is rejected. Gemma stays in pilot even though personal e-mails can only go there, so a person checks every draft.</p><h3>Tool consolidation (added 18 Nov)</h3><p>The staff of a made-up 50-person firm use 8 AI meeting assistants and 5 chatbots, all real products, and 11 people use two or more meeting assistants. For each tool, AI research agents read the vendor's own pages on 18 Nov 2026. They checked where the data is stored, whether there is an EU region, a data-processing agreement (DPA), training on the firm's data and Czech support. Each fact has its page, date and a short quote, or &quot;not published&quot; where the vendor says nothing.</p><h3>The verdict: 3 stay for a pilot, 10 go</h3><p>The firm keeps 3 for a six-week pilot, Microsoft 365 Copilot with Teams Premium as one candidate and ChatGPT Business as the other. It retires the other 10. They lack Czech, keep data in the US or offer EU hosting only on top plans, may train on the firm's data, publish no DPA, or run on personal accounts with no contract. The two that come closest stay in reserve in case the pilot fails.</p><h3>What it would cost the made-up firm</h3><p>The seats are SIMULATED; the list prices and Czech National Bank rates are real, read on 18 Nov 2026. Today the firm's 13 tools cost 30,911 Kč a month, and the table compares four ways to replace them. The two with an office server are estimates, mostly hardware and admin time. The Microsoft 365 the firm already pays for is left out of every option.</p><table><caption>Monthly cost for the made-up firm. Seats are SIMULATED; list prices and Czech National Bank rates as read on 18 Nov 2026.</caption><thead><tr><th scope="col">Option</th><th scope="col">A month</th></tr></thead><tbody><tr><th scope="row">Today: the firm's 13 tools</th><td>30,911 Kč</td></tr><tr><th scope="row">Copilot for 44 people</th><td>19,528 Kč</td></tr><tr><th scope="row">ChatGPT Business for 40 plus Teams Premium for 30</th><td>22,764 Kč</td></tr><tr><th scope="row">An office server that writes the meeting notes, plus Copilot for 40 (estimate)</th><td>about 22,557 Kč</td></tr><tr><th scope="row">The server plus Mistral's EU API for the chat (estimate)</th><td>about 8,052 Kč</td></tr></tbody></table><h3>Why buying wins for now</h3><p>The server with Mistral's API is cheapest on paper, but it has none of the bought tools' apps, files or web search and needs admin work the firm must be able to do. So buying wins unless Czech recaps in Teams fail the pilot.</p><h3>The documents, in Czech and English</h3><p>A pilot rule has pass numbers set in advance. For meeting notes these are, among others, at least 90 % of action items kept unchanged over at least 20 meetings and at least 10 minutes saved per meeting. A one-page staff guide sorts data into green, amber and red. There is a 75-minute workshop and four GDPR templates: a DPIA outline, a record of processing, a recording notice and a retention rule. Each is marked as a template, not legal advice.</p><h3>Meeting notes on the PC (added 18 Nov)</h3><p>This is the server option, built small on my PC. Whisper large-v3-turbo transcribes the recording on the graphics card. The privacy filter replaces details of people outside the meeting with stand-ins such as [jméno A] and keeps the participants' names, in their Czech forms and nicknames. Gemma 4 12B then writes a summary, the decisions and the action items, each with an owner, a due date and a quoted line.</p><h3>Code checks the notes, a person approves</h3><p>Code checks that each quote stands in the transcript, each owner took part and each date fits its quote's words. In the test it caught three dates on the wrong weekday. Code sends a failed draft back once. The registry marks the app local-only, so the gateway never sends it to the cloud. A person edits and approves the draft, and nothing is sent anywhere. Audio is deleted after 7 days, transcripts after 30.</p><h3>The meeting test: 13 of 16 action items found</h3><p>The test has three made-up Czech meetings (SIMULATED) plus one real English meeting from the AMI Meeting Corpus (21 minutes, CC BY 4.0). Graded by code: 13 of 16 action items found, no extra items, and 8 of 9 decisions. The filter hid 11 of 16 planted personal details fully and 2 partly, and missed 3: an e-mail address and a street address said aloud, and a colleague's sick leave.</p><h3>Who did what in the 18 Nov parts</h3><p>From options the agent put to me I chose real product names with a source for each fact, a synthetic Czech voice for the test meetings for now, and one public AMI meeting. The agent made up the firm, picked the 13 tools and wrote the kit, the documents, the test meetings and the code; its research subagents read the vendors' pages.</p><h3>More detail: the meeting test and the lab runs of 18 and 19 Nov</h3><p>How the meeting test was set up and timed. Then the lab with bigger local models, one run each. On the same 36 e-mails, gpt-oss-120b got 35 of 36 decisions right at a median 33.7 s, and gpt-oss-20b 28 of 36 at 4.6 s.</p><h4>The meeting test in detail</h4><p>The Czech meetings were written by the same AI agent that built the app and voiced by one Windows Czech voice at different pitches. The AMI meeting's expected items come from the corpus annotators. Whisper took 64 s of GPU time for 27.6 minutes of audio on a shared card. Gemma wrote each meeting's notes in 5.4 to 14.4 s, and the API cost was $0.</p><table><caption>Meeting test, graded by code: three made-up Czech meetings (SIMULATED) and one real English AMI meeting.</caption><thead><tr><th scope="col">What was counted</th><th scope="col">Result</th></tr></thead><tbody><tr><th scope="row">Action items found</th><td>13 of 16</td></tr><tr><th scope="row">With the right owner</th><td>11</td></tr><tr><th scope="row">With the right due date</th><td>13</td></tr><tr><th scope="row">Extra items</th><td>none</td></tr><tr><th scope="row">Decisions found</th><td>8 of 9</td></tr></tbody></table><h4>Bigger local models on the same 36 e-mails</h4><p>Bigger local models, on the same 36 support e-mails, in a separate lab project: one run each, 18 and 19 Nov 2026, graded by the toolbox's own code. The hardware was the same RTX 5070 Ti 16 GB with 64 GB of RAM, with llama.cpp. It is a different run with different server settings from the 11 Nov eval above.</p><h4>What the three models got</h4><p>gpt-oss-120b, whose 63.4 GB file sits partly in RAM, got 35 of 36 decisions right and 33 e-mails fully right, at a median 33.7 s per e-mail. Gemma 4 12B got 33 of 36 (7.3 s), and gpt-oss-20b 28 decisions right and 26 fully right (4.6 s).</p><table><caption>Lab run on the same 36 support e-mails, one run each: decisions right, e-mails fully right and the median time per e-mail. Not the 11 Nov eval.</caption><thead><tr><th scope="col">Model</th><th scope="col">Decisions</th><th scope="col">Fully right</th><th scope="col">Median</th></tr></thead><tbody><tr><th scope="row">gpt-oss-120b</th><td>35 of 36</td><td>33</td><td>33.7 s</td></tr><tr><th scope="row">Gemma 4 12B</th><td>33 of 36</td><td>33</td><td>7.3 s</td></tr><tr><th scope="row">gpt-oss-20b</th><td>28 of 36</td><td>26</td><td>4.6 s</td></tr></tbody></table><h4>DeepSeek V4.1 Flash on 10 of the e-mails</h4><p>DeepSeek V4.1 Flash, about 249 GB at 2-bit, ran on 10 of the 36 and got all 10 right, but took a median 592 s, about 10 minutes, per e-mail. That is because its experts don't fit in 64 GB of RAM and are read from disk during every answer. Gemma and both gpt-oss models got 9 of the same 10.</p><h4>Local models as a personal-details filter</h4><p>The same lab tried local models as a personal-details filter, on the Insurance Assistant's 453 made-up messages with 309 details, written by Claude (SIMULATED; one run, 18 Nov 2026). The messages look cleaner than real ones, so read all the figures below as upper estimates.</p><h4>What each filter caught</h4><p>gpt-oss-120b alone caught 282 (91.3 %) with no false alarm on 163 ordinary messages. Gemma 4 12B caught 270 (87.4 %), gpt-oss-20b 250 (80.9 %), and the rules filter this toolbox uses 266 (86.1 %, 9 false alarms). Rules first and then gpt-oss-120b or Gemma caught 283 (91.6 %). On a 70-row slice DeepSeek caught 57 of 60 (19 Nov), 3 more than the 120b, too few to show it is reliably better.</p><table><caption>Personal details caught, of 309 in 453 made-up messages (SIMULATED; one run, 18 Nov 2026). Upper estimates.</caption><thead><tr><th scope="col">Filter</th><th scope="col">Caught</th></tr></thead><tbody><tr><th scope="row">gpt-oss-120b alone (no false alarm on 163 ordinary messages)</th><td>282 (91.3 %)</td></tr><tr><th scope="row">Gemma 4 12B alone</th><td>270 (87.4 %)</td></tr><tr><th scope="row">gpt-oss-20b alone</th><td>250 (80.9 %)</td></tr><tr><th scope="row">The rules filter this toolbox uses (9 false alarms)</th><td>266 (86.1 %)</td></tr><tr><th scope="row">Rules first, then gpt-oss-120b or Gemma</th><td>283 (91.6 %)</td></tr></tbody></table><h2>Limits and decisions</h2><ul><li><strong>A made-up shop and firm.</strong> Every order, customer, wiki page and team is made up, and so are the 50-person firm, its seats and its Czech meetings. Nothing was sent to a customer. The public demo runs support e-mails without personal details live on Claude Haiku; the local model, the consolidation kit and the meeting notes run only on my PC.</li><li><strong>Not an independent test.</strong> The same AI agent wrote the system and the 36 test e-mails, and the e-mails were written knowing the privacy filter, so its catch rate here says little. The same goes for the three Czech test meetings; only the AMI meeting's expected items come from other people. How good the drafts read and how much staff time they save are not measured.</li><li><strong>The local model is not approved.</strong> Gemma misses the 90 % rule, yet e-mails with personal details may only go to a local model. The registry records that conflict instead of hiding it: until a local model passes, a person checks every draft and ticket. The second local candidate, gpt-oss-20b, did not pass either (77.8 %).</li><li><strong>11 Nov eval: local times on a shared card.</strong> In the 11 Nov eval, Gemma's run shared the graphics card with another local job and a game, so its 20.1 s median per e-mail is not a clean speed test. In the same eval gpt-oss-20b had the card to itself (4.8 s median), so the two times cannot be compared.</li><li><strong>Real vendors, facts from one day.</strong> The 13 tools and their facts are real, read on 18 Nov 2026 by AI research agents through a fetch tool that can paraphrase. The agent re-read most of the facts that decide a verdict in a browser; nobody else has checked them.</li><li><strong>Prices and terms change.</strong> Prices and terms change, so the totals hold for that day. The agent re-read the 11 list prices on 19 Nov 2026: ten were unchanged, and tl;dv's page showed $29 instead of €29, which would lower today's total by about 250 Kč.</li><li><strong>No lawyer and no pilot with people yet.</strong> The templates were not checked by a lawyer, and the pilot has not run with people.</li><li><strong>One synthetic voice, no speaker separation.</strong> The Czech meetings are one synthetic voice, easier than a real room with crosstalk, room microphones and accents. Whisper doesn't say who speaks, so an action item said in the first person (&quot;I'll send it&quot;) has no owner. Of three such items, two were missed and one went to the wrong person. No meeting was longer than 21 minutes, and no person has reviewed a draft yet, so review time and the share of items kept are not measured.</li><li><strong>Open: stand-ins and health details.</strong> Approved notes keep the stand-ins, so a reader of &quot;[jméno D]&quot; can't tell who D is; typing the name back in would put a personal detail into shared notes. The staff guide says health details go into no AI tool. Yet a recorded meeting where someone mentions a colleague's sick leave still goes through Whisper and Gemma on the PC, and the filter missed exactly such a phrase in the test. Both are open decisions.</li><li><strong>Lab figures: one run each.</strong> Every lab figure is from one run, so there is no spread between runs, and whether the PC was also in use during a run was not recorded. Not measured: DeepSeek on the whole sets (it ran 10 of 36 e-mails and 70 of 453 messages), other reasoning settings, and several users at once. All the test sets are made up, mostly by AI agents.</li></ul><h2>What's inside</h2><ul><li>Before the first model call, the gateway sorts each message into one of three data classes</li><li>A cloud run stops if a tool result turns out to hold personal details</li><li>The local model is Gemma 4 12B (QAT Q4_0, Apache 2.0) in llama.cpp on the PC's RTX 5070 Ti 16 GB…</li><li>One MCP server offers the support tools (find an order, list, search and read the wiki, open a…</li><li>The support agent reads one e-mail, looks up the order (code has already counted the days and…</li><li>The eval</li></ul><p>Built with: Claude API, MCP, llama.cpp, Python, Claude Code</p><p><a href="/work/crm-campaign/">Previous project: CRM Campaign</a> · <a href="/work/job-outreach/">Next project: Job Outreach</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20AI%20Toolbox">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
