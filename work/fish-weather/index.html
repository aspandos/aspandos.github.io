    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Fish Weather</h1><p>Six weathers, one timeline, every change cued to music</p><p>Solo-directed 60-second Blender reel: a rigged fish on a tiny planet walks through six weathers timed to music, plus a game-ready 33-bone skeleton for Unreal. Python pipeline written with an AI agent.</p><p>A 60-second vertical reel: a rigged fish in sneakers walks on a tiny planet (1.5 m radius) while the world turns from sunrise through wind, rain, a thunderstorm and snow to a starry night. Python builds the whole scene headless in Blender, and one keyframed timeline drives the Geometry Nodes weather, a Mantaflow fog the fish wades through and Dynamic Paint footprints in the snow; its acts follow the song's vocal phrases, while lightning and camera cuts sit on the 112.2 BPM beat grid. The walk runs on a procedural rig built over an AI-generated mesh, its smoothness was measured frame by frame, and the rig was exported to Unreal as a game-ready skeleton.</p><h2>What's inside</h2><ul><li>The timeline is the single source of truth</li><li>Tiny-planet locomotion without foot sliding</li><li>Simulations that react to the character, set up in code</li><li>Animation quality backed by numbers</li><li>Game-ready branch</li></ul><p>Built with: Blender, Python, Geometry Nodes, Tripo, Unreal Engine 5, FFmpeg, PowerShell</p><p><a href="/work/night-drive/">Previous project: Undercover Ecstasy</a> · <a href="/work/dlss-render/">Next project: DLSS Render</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Fish%20Weather">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
