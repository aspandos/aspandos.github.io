    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/automation/">Automation</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Lead Intake</h1><p>Lead sorting in n8n</p><p>I run a working n8n automation on a rented server in the EU, and you can try it right away. It checks a message from a web form, looks up the company by its ID number (IČO) in the Czech ARES register, uses Claude to sort the message by type and priority, and drafts a reply for the team.</p><p>A live n8n demo that sorts customer messages with Claude.</p><h2>How it works</h2><p>The workflow connects several apps and cloud services through their APIs: the public REST API of the ARES register, Anthropic's Messages API and Google Sheets with a service account. The request to Claude is built from the message and the ARES data, and Claude's answer has to fit a fixed JSON schema. The result is stored in a table in n8n and also, without the message text, in two Google Sheets files. A scheduled job runs every hour, and once a day has ended it calls a webhook that links that day's decision records into a chain of SHA-256 hashes; the /overeni check page recomputes that chain right in the browser.</p><p>The logic is covered by 102 unit tests that run before every deployment. Twelve sample messages, including spam and a prompt injection attempt, go through the workflow on a local n8n instance, from the check and the ARES lookup to sorting by the fixed rules, with no AI call. A daily cap of 150 AI calls limits the cost. If Claude fails, gives an answer that does not fit the schema, or the cap is used up, the fixed rules sort the message instead. A separate error workflow catches failures. If saving to Google Sheets fails, the message is not lost and an alert row appears in n8n. The demo runs in Docker behind an nginx reverse proxy that makes only the demo's own pages reachable from the internet.</p><p>The demo's logic is written in JavaScript and the scheduled job in Python. AI coding agents (Claude Code) write the code in my projects under my direction; the brief, workflow design, test criteria, review and sign-off are mine.</p><h2>What's inside</h2><ul><li>The public form asks for a message, an optional company ID (IČO) and consent, never a name or…</li><li>Claude Haiku sorts each message in one Messages API call that must answer in a fixed JSON schema…</li><li>The visitor's text sits inside &lt;inquiry&gt; tags, is marked as data in the prompt and has its own…</li><li>Costs are capped at 150 AI calls a day.</li><li>Only the demo's own pages are reachable from the internet</li><li>Every stored message also gets a receipt with its number and time, Claude or the rules (and why)…</li></ul><p>Built with: n8n, Claude API, JavaScript, Python, Docker, Claude Code</p><p><a href="/work/audiovj/">Previous project: AudioVJ</a> · <a href="/work/liquid/">Next project: Liquid / Obsidian Bloom</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Lead%20Intake">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
