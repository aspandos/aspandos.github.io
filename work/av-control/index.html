    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>AV Control</h1><p>A phone VJ panel that builds itself from TouchDesigner</p><p>Dependency-free phone VJ panel that builds 255 controls from TouchDesigner's parameter schema and drives a whole live set over one WebSocket. Concept and direction: Aspandiyar Kurman; code written with AI agents.</p><p>AV Control is the phone and laptop control surface for my TouchDesigner AudioVisualizer: about 3,100 lines of plain HTML, CSS and JavaScript with no framework or build step, served by TouchDesigner's own web server. On connect it receives the parameter schema, builds all 255 web-exposed controls from it, then stays in sync over one WebSocket carrying ~30 Hz audio levels, state changes and a binary JPEG preview. It covers a whole live set (style tiles, auto director, Kinect body control, MIDI learn, presets, lyric tap-sync, recording), and a standard-library Python mock server lets the panel be developed without TouchDesigner.</p><h2>What's inside</h2><ul><li>Schema-driven UI</li><li>Real-time sync hygiene</li><li>Live visuals in the browser</li><li>MIDI learn</li><li>Responsive and accessible</li></ul><p>Built with: JavaScript, WebSocket, HTML &amp; CSS, Canvas 2D, TouchDesigner, Python, MIDI, Kinect</p><p><a href="/work/triad/">Previous project: Triad</a> · <a href="/work/banana-heaven/">Next project: Banana Party in Heaven</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20AV%20Control">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
