    <noscript><h1>Bad Karma</h1><p>Code-built ink-sketch music video, synced to every kick</p><p>A 40-second vertical music video set to Axel Thesleff's “Bad Karma”: a Dumb Head sculpture stands as a 14 m monument on a graph-paper world, a crowned shrimp plays trumpet on top, and on the drop the scene floods with colour and bursts into doodles. Nothing in the .blend files is edited by hand: one build script and seven Python modules regenerate the whole scene headless in Blender 5.2, and a custom numpy FFT analysis turns the track into per-frame kick, snare, hi-hat and bass curves that feed 187 drivers. Concept, art direction and both characters are my own; the pipeline code was written by AI coding agents under my direction.</p></noscript>
