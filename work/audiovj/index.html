    <noscript><h1>AudioVJ</h1><p>Gamepad-played VJ engine that follows beats, drops and vocals</p><p>AudioVJ is a standalone Unreal Engine 5 app, written in C++ and HLSL, that is played live with an Xbox gamepad across six scenes: a 262k-particle swarm, a night drive under spectrum-analyzer light arches, a temple of floating prism-lit shards, a flight through volumetric clouds, a character walking a tiny planet and four real-time liquids. It listens to song files, a mic or whatever the PC is playing, extracts bands, onsets, tempo, bar phase, build-ups, drops and the singer's pitch, and a director turns them into cameras, post-processing and material parameters. Nothing is wired by hand in the editor: a build script generates every material from tagged HLSL, and scripted self tests check each scene's frame time and behaviour.</p></noscript>
