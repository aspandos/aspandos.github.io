    <noscript><h1>Ruins</h1><p>Path-traced light, played live by the music</p><p>A vertical, music-driven TouchDesigner piece set in two photogrammetry ruins, the Odeon of Herodes Atticus in Athens and Hore Abbey in Ireland, each with a character at its centre. Each scene is baked in Blender Cycles into ten lightmaps, one per light, and a custom GLSL shader re-mixes them every frame at intensities set by the music, so path-traced shadows and bounce light run live at 60 fps. An offline Demucs analysis tells a Python director where every bar, section and drop falls, and the director cuts cameras, blinks lights and changes scenes on that grid.</p></noscript>
