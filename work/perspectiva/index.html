    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Perspectiva</h1><p>An engraved Piranesi hall, raymarched live to the music</p><p>Real-time music visual for the author's own song: a raymarched Piranesi hall inked in GLSL. Concept and direction by Aspandiyar Kurman, code written with AI agents; measured 60 fps, five finished reels.</p><p>Perspectiva is a vertical 1080×1920, 60 fps music visual for the author's own song 'Stoned and Alone', built entirely in GLSL inside TouchDesigner with no pre-rendered footage. One raymarched SDF Piranesi hall is inked three ways (a sepia etching by day, an ivory scratchboard by night, a lapis 'midnight dream'), and a Python director follows the lyrics from morning to midnight, match-dissolving between them on shared cameras, on the beat. The architecture plays the song (the balustrade is a 16-band equalizer, the stair a beat sequencer), the 529-operator network is generated from Python and holds 60 fps on an RTX 5070 Ti, and eight shading styles and six optional features branch off the same world.</p><h2>What's inside</h2><ul><li>One 51 KB SDF hall (helical stair, rusticated arcades, galleries on three levels) is shared…</li><li>Music analysis</li><li>Beat-locked match-dissolves</li><li>Procedural and testable</li><li>Look-dev branches on the same world</li></ul><p>Built with: TouchDesigner, GLSL, Python, Demucs, FFmpeg, PowerShell</p><p><a href="/work/audiovj/">Previous project: AudioVJ</a> · <a href="/work/audiovisualizer/">Next project: AudioVisualizer</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Perspectiva">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
