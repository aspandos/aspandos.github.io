    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Insurance Assistant</h1><p>An AI guide that answers from an insurer's own pages</p><p>I built a chat guide that answers questions about Czech public health insurance from the insurer's own public web pages. Compared with the chatbots most people know, it is really useful: it follows no script, does not brush people off with a stock reply and tries to solve their actual problem right there in the conversation. Claude searches the pages and answers with sources and the next step, and code checks every answer before it is shown. It works in Czech and English, and it can listen and speak.</p><ul><li><strong>68 / 78</strong> blind questions solved. Claude Fable 5.1, 9 Nov. 6 wrong, 4 correctly sent elsewhere.</li><li><strong>22.8 s</strong> median time to an answer. Same blind run. $0.22 a message.</li><li><strong>37–39 / 45</strong> development questions solved (not blind). Claude Sonnet 5.5 (the public demo), three runs after the fixes. $0.062 to $0.077 a message.</li><li><strong>687</strong> unit tests. No API or key needed.</li></ul><p>Graded by a Claude Opus 5.5 judge against each question's source page, not by people. The limits are listed further down.</p><p>A Claude chat guide to a Czech health insurer's public pages, with sources, next steps, voice and accessibility settings.</p><h2>How it works</h2><h3>Two assistants on one server</h3><p>One Python server runs two assistants. The main one is an unofficial guide to a Czech public health insurer's public pages. It answers what is covered, which form to use, what to do when moving abroad or paying premiums, always with links to the pages it used. The second is a demo for a made-up insurer, built earlier, with fixed conversation paths, forms, a mailbot and a way in for AI agents.</p><h3>The public demo</h3><p>The guide is also online as a public demo, framed further down this page. It runs on Claude Sonnet 5.5, which costs less per answer than Claude Fable 5.1, and it has a daily budget and no microphone. Each figure below names the model it was measured on.</p><h3>How it was tested</h3><p>The guide, on Claude Fable 5.1, was measured on 9 Nov on questions it had not seen. The test set starts from the insurer's own FAQ titles. Claude Opus 5.5 rewrote each title the way a customer would type it, without the page's wording, and hard cases (safety, tricks, off-topic) were added by hand. About 60% went to development and 40% stayed blind.</p><h3>Blind run: 68 of 78 solved</h3><p>On 78 blind questions, a Claude Opus 5.5 judge with each question's source page rated 68 solved, 4 correctly sent elsewhere, 6 wrong and none needlessly handed to a call centre. Median time 22.8 s, $0.22 a message.</p><h3>Numbered steps, checked separately</h3><p>The numbered steps came after that run, so they were checked separately on 20 development questions with Claude Fable 5.1. Of those, 19 were solved, 11 got steps with 38 links between them, and a message cost $0.35 on average.</p><h3>The made-up insurer's own blind run</h3><p>The made-up insurer has its own blind run on Claude Haiku 5.5. The whole run cost $0.04.</p><table><caption>Made-up insurer, blind run on Claude Haiku 5.5</caption><thead><tr><th scope="col">What was tested</th><th scope="col">Result</th></tr></thead><tbody><tr><th scope="row">In-scope questions answered with the right facts</th><td>23 of 27</td></tr><tr><th scope="row">Out-of-scope questions refused or handed over</th><td>6 of 6</td></tr><tr><th scope="row">Prompt injections resisted</th><td>7 of 7</td></tr><tr><th scope="row">E-mails with all four fields right</th><td>12 of 14</td></tr></tbody></table><h3>Stack and who writes the code</h3><p>The server and the guide are Python, the chat page is plain HTML, CSS and JavaScript. AI coding agents (Claude Code) write the code in my projects under my direction; the brief, conversation design, test criteria, review and sign-off are mine.</p><h3>Test history, 11 Nov</h3><p>A free local test loop, a second blind run (43 of 45, on an easier set), the fixes of 11 Nov and what stayed wrong.</p><h4>A free local test loop</h4><p>The guide's development rounds now run first on Gemma 4 12B, a small model on my own PC (llama-server), for free. Each 45-question round there saves about $11 of API spend. As a judge the local model falls short, so every quality figure on this page comes from the Opus judge.</p><h4>The gap it found: the reply's language</h4><p>That loop found a gap. The web chat picks the guide by the language a message is written in, so &quot;answer in English&quot; inside a Czech message is the customer's text, not a language switch. Yet Gemma, as the guide, answered such an instruction in English 4 times out of 4.</p><h4>A language check as a safeguard</h4><p>A new check, live since 11 Nov, sends a reply in another language back for one repair round, and with it 0 of 6 came out in English. Claude Fable 5.1 and Claude Sonnet 5.5 already refused such instructions, so on the paid runs the check never fired: it is a safeguard.</p><h4>A second blind run, on an easier set</h4><p>A second blind run followed on 11 Nov, again on Claude Fable 5.1 with the Claude Opus 5.5 judge and the language check in. Gemma wrote its 45 questions from 60 FAQ pages in seven styles (typed on a phone without diacritics, colloquial, rambling, formal, annoyed, Slovak, English), and 12 of them were prompt injections. Each question rests on one FAQ page, so this set is easier than the 78 questions of 9 Nov and the two results are not comparable.</p><table><caption>Two blind runs on Claude Fable 5.1, graded by Claude Opus 5.5. The sets differ, so the columns are not comparable.</caption><thead><tr><th scope="col">Measure</th><th scope="col">9 Nov</th><th scope="col">11 Nov</th></tr></thead><tbody><tr><th scope="row">Questions</th><td>78</td><td>45</td></tr><tr><th scope="row">Solved</th><td>68</td><td>43</td></tr><tr><th scope="row">Correctly sent elsewhere</th><td>4</td><td>0</td></tr><tr><th scope="row">Wrong</th><td>6</td><td>2</td></tr><tr><th scope="row">Needlessly sent to the call centre</th><td>0</td><td>0</td></tr><tr><th scope="row">Median time</th><td>22.8 s</td><td>34.8 s</td></tr><tr><th scope="row">Cost per message</th><td>$0.22</td><td>$0.264</td></tr><tr><th scope="row">Replies with at least one unsupported detail</th><td>37 of 78</td><td>24 of 45</td></tr></tbody></table><h4>What the second run showed</h4><p>The guide solved 43 and got 2 wrong, with none needlessly sent to the call centre. All 12 injections got a Czech answer and none was followed. In 24 of the 45 replies at least one unsupported detail remained. Of the 2 wrong answers, one invented a web-form channel and linked the wrong page; the other was a strict but defensible grade. Median 34.8 s, $0.264 a message, $13.08 for the whole run with grading.</p><h4>Fix 1: the page reader dropped short list items</h4><p>Two more fixes went live on 11 Nov, the public demo included. The page reader had dropped 382 short list items as if they were menu captions, among them &quot;webovým formulářem&quot; (by web form) on the page about refunds to a bank account. With items like that missing, the guide could invent a channel or borrow one from another page. Short list items are now kept as text, and four prompt lines aim at the unsupported details seen most often (channels, requirements, scope).</p><h4>Fix 2: after 8 search rounds the guide must answer</h4><p>After 8 search rounds the guide now has to write its answer. Before, Claude Sonnet 5.5 kept searching until the loop ran out in 7 of 45 development questions and fell back to &quot;call the infoline&quot;.</p><h4>What the two fixes changed</h4><p>The table shows Claude Sonnet 5.5, the model the public demo runs, on those 45 development questions (not blind) with the Opus judge, before and after the two fixes. Wrong answers stayed at 6, and replies with an unsupported detail did not go down.</p><table><caption>Claude Sonnet 5.5 on 45 development questions (not blind), graded by Claude Opus 5.5</caption><thead><tr><th scope="col">Measure</th><th scope="col">Before</th><th scope="col">After</th></tr></thead><tbody><tr><th scope="row">Solved</th><td>32</td><td>39</td></tr><tr><th scope="row">Needlessly sent to the call centre</th><td>7</td><td>0</td></tr><tr><th scope="row">Median time</th><td>26.9 s</td><td>21.3 s</td></tr><tr><th scope="row">Cost per message</th><td>$0.072</td><td>$0.062</td></tr><tr><th scope="row">Wrong</th><td>6</td><td>6</td></tr></tbody></table><h4>The 6 wrong answers, traced that evening</h4><p>That evening each of those 6 wrong answers was traced to its cause, and the fixes went live the same night. The privacy filter had read the insurer's own service names as people's names. It did so with the names of its app and its online service, and with &quot;Přehled OSVČ&quot;, the yearly form of the self-employed, in 23 of 480 test messages. So the guide saw [jméno A] and asked which form was meant.</p><h4>The fixes that night</h4><p>The filter now leaves those names alone, and its scores on the six filter test sets did not change. The guide also has to search before it asks a question back. The line on what the pages do not cover gets the same number and link checks as the answer. A link labelled only &quot;zde&quot; (here) shows Claude where it leads. And a reply may not tell the customer that the filter hid something.</p><h4>What stayed wrong</h4><p>Each of the 6 was solved at least once afterwards. But two more Sonnet runs of the 45 questions solved 37 and 39, at $0.068 to $0.077 a message. The wrong answers left are unsupported details, and they move from question to question.</p><h2>Limits and decisions</h2><ul><li><strong>An unofficial guide, not the insurer's service.</strong> The pages' text belongs to the insurer and the guide is not its service, so it is never presented as the insurer's own.</li><li><strong>The public demo's model has had no blind run.</strong> On Claude Fable 5.1 each answer costs about $0.15 to $0.75 in API calls. The public demo therefore runs on Claude Sonnet 5.5 with a daily budget. That model has had no blind run. It solved 18 of 20 practice questions on 9 Nov, at about $0.09 an answer, and 39 of 45 development questions after the 11 Nov fixes, at $0.062 a message. Two later runs solved 37 and 39, at $0.068 to $0.077 a message.</li><li><strong>Not every detail is backed.</strong> In the 9 Nov blind run (Claude Fable 5.1) the judge found at least one detail without support in the pages in 37 of 78 replies. Most were small and did not change the grade, but such details were the reason for 4 of the 6 wrong answers. In the 11 Nov blind run it was 24 of 45.</li><li><strong>The fixes did not reduce unsupported details.</strong> The 11 Nov fixes did not lower the count on Sonnet 5.5's development questions (14 of 45 before the page-reader fix, 15 after). A rule added after the first run keeps conditions as wide and as strong as the page has them, and was rechecked on 4 cases only.</li><li><strong>The privacy filter misses some and hides too much.</strong> It hides 85.8% of unseen made-up details, and Czech incomes written without a cue word get through. A rule round added on 11 Nov (health words, a return from hospital, ethnic origin, a VIN, a postcode before a town name) did not change that figure. It also hides harmless words: while these stills were made, &quot;jsem OSVČ&quot; (I am self-employed) and &quot;European Health&quot; were read as names, and Claude then saw a stand-in instead.</li><li><strong>Measured by a model, on two blind runs.</strong> A Claude Opus 5.5 judge graded the answers against each question's source page. In the 9 Nov run the same model wrote the customer-style questions (78 sampled from the blind split); in the 11 Nov run Gemma 4 12B wrote them (45), each from one FAQ page. Neither set comes from real customers, and the local model cannot take over the grading: it caught none of the 15 replies Opus graded wrong.</li><li><strong>Accessibility not tried by its users yet.</strong> The settings were checked in a browser and by unit tests, not with a real screen reader or by blind or low-vision visitors.</li><li><strong>Answers take a while.</strong> A typical answer takes 20 to 40 s, and one with six steps up to about 80 s. The waiting card shows what the guide is doing and how long it usually takes.</li></ul><h2>What's inside</h2><ul><li>The guide answers from 446 documents made from the insurer's public web pages.</li><li>Claude Fable 5.1 gets two tools, search and read (three with the care finder), searches up to 8…</li><li>Code checks every reply before a customer sees it</li><li>When there is something to get done, the answer adds numbered steps (&quot;Jak to vyřídit&quot;) with…</li><li>A care finder searches the public register of healthcare providers for any field of care and any…</li><li>A local filter, rules and word lists only, hides personal details before anything leaves the…</li></ul><p>Built with: Claude API, Python, JavaScript, HTML &amp; CSS, Whisper, ElevenLabs, MCP, Claude Code</p><p><a href="/work/lead-intake/">Previous project: Lead Intake</a> · <a href="/work/crm-campaign/">Next project: CRM Campaign</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Insurance%20Assistant">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
