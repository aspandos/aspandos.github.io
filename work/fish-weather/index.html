    <noscript><h1>Fish Weather</h1><p>Six weathers, one timeline, every change cued to music</p><p>A 60-second vertical reel: a rigged fish in sneakers walks on a tiny planet (1.5 m radius) while the world turns from sunrise through wind, rain, a thunderstorm and snow to a starry night. Python builds the whole scene headless in Blender, and one keyframed timeline drives the Geometry Nodes weather, a Mantaflow fog the fish wades through and Dynamic Paint footprints in the snow; its acts follow the song's vocal phrases, while lightning and camera cuts sit on the 112.2 BPM beat grid. The walk runs on a procedural rig built over an AI-generated mesh, its smoothness was measured frame by frame, and the rig was exported to Unreal as a game-ready skeleton.</p></noscript>
