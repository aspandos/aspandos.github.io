    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>AudioVJ</h1><p>Gamepad-played VJ engine that follows beats, drops and vocals</p><p>UE5 VJ app played live on a gamepad: a custom audio analyzer (beats, drops, vocals) drives six real-time scenes; self-tests check frame time. Solo concept and direction; code written with AI agents.</p><p>AudioVJ is a standalone Unreal Engine 5 app, written in C++ and HLSL, that is played live with an Xbox gamepad across six scenes: a 262k-particle swarm, a night drive under spectrum-analyzer light arches, a temple of floating prism-lit shards, a flight through volumetric clouds, a character walking a tiny planet and four real-time liquids. It listens to song files, a mic or whatever the PC is playing, extracts bands, onsets, tempo, bar phase, build-ups, drops and the singer's pitch, and a director turns them into cameras, post-processing and material parameters. Nothing is wired by hand in the editor: a build script generates every material from tagged HLSL, and scripted self tests check each scene's frame time and behaviour.</p><h2>What's inside</h2><ul><li>Hand-written audio analyzer</li><li>Singer tracking from two sources</li><li>GPU simulation in float render-target ping-pong passes</li><li>About 56k lines of C++ (86 files) and 7.8k lines of HLSL (33 files).</li><li>Production habits</li></ul><p>Built with: Unreal Engine 5, C++, HLSL, Python, Demucs, PowerShell, FFmpeg</p><p><a href="/work/dlss-render/">Previous project: DLSS Render</a> · <a href="/work/perspectiva/">Next project: Perspectiva</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20AudioVJ">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
