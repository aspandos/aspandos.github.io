    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>CRM Campaign</h1><p>A bank campaign from SQL audience to a measured run</p><p>One CRM campaign for a fictional bank, taken from the idea to a measured run on simulated data: a business case, a target group in SQL with exclusions that fail closed, a journey across e-mail, push and a banker hand-over, and a measurement plan written before the run. The same campaign then ran end to end in Mautic, an open-source marketing-automation engine, on my PC. Nothing was sent to a real person. Both readings of that run are &quot;not shown&quot;, and the report says why and names no winner.</p><p>A demo CRM campaign for a made-up bank on simulated data: the audience in SQL, the journey run in Mautic, the result read against a holdout.</p><h2>How it works</h2><p>The campaign is called &quot;Nejdřív rezerva, pak investice&quot; (a reserve first, investing later). A fictional bank, Ukázková banka (fiktivní), offers a savings account with a standing order the day after salary to clients who regularly have money left on their current account before payday. The first part is done on paper and in SQL. A business case says when the offer pays: money a client only moves from a current account to a savings account at the same bank earns the bank nothing, so only money from outside counts. Nine SQL steps in SQLite pick the audience from 200,000 synthetic clients. Eleven exclusion rules take the 55,210 clients who match the target rule down to 39,132, and they fail closed: a missing row or a NULL removes the client (SIMULATED). A measurement plan then fixes the groups, the metric and the decision rule before any result exists.</p><p>One simulated run then plays 39,132 clients through the journey (SIMULATED). The holdout converted at 1.545% and the contacted clients at 2.002%, a difference of +0.457 percentage points with a 95% interval from +0.004 to +0.827. Overall the lower bound sits just above zero, but in neither of the two segments set in advance. The plan decides by segment, so the decision is &quot;inconclusive: repeat with a 20% holdout&quot;. The A/B test of two in-app cards shows no difference, and the banker calls do not pay for themselves. The plan named this outcome as the likely one before the run. The same report shows why opens mislead: a dashboard would read a 52.6% open rate and 703 opened accounts, while people opened only 21.0% of the e-mails and the comparison with the holdout credits the campaign with about 160 accounts.</p><p>The second part runs the same campaign in a real engine. Mautic 7.2.2 runs on my PC with MariaDB and a local mail catcher, on 127.0.0.1 only. A Python bridge loads the SQL audience into Mautic as contacts, a &quot;salary credited&quot; event lets each client in the next day, and a 17-step campaign built through Mautic's API takes them through the holdout check, the consent check, e-mail A or B, a click decision and then a push or a hand-over to a banker. A simulator plays the clients: it opens the tracking pixel, clicks, unsubscribes, takes the banker's call and converts. One demo day lasts one minute.</p><p>Consent is checked when a contact is loaded, inside the journey and again at send time. Missing consent becomes a Do-Not-Contact in Mautic, every e-mail has a one-click unsubscribe, and any opt-out ends the offer in every channel. A stub gateway then reads the contact once more before each push and each hand-over to a banker. A push that comes due outside 08:00 to 20:00 waits for 08:00 and is checked again. Run 1 dropped such pushes, 257 of 512; I asked for the fix and a second run, in which all 335 held pushes were delivered later (SIMULATED).</p><p>Official run 2 took 2,000 sampled synthetic clients and 9 test personas (SIMULATED). 1,700 entered, 1,283 e-mails went to the mail catcher, 296 were opened and 26 clicked, 8 clients unsubscribed, 509 pushes were delivered and 11 warm leads reached the banker queue. All 9 safety checks passed: no message to any of the 300 clients the SQL excluded or the 163 holdout clients, no e-mail without consent, nothing after an opt-out. Both readings are &quot;not shown&quot;. Campaign against holdout: 1.50% against 3.07%, a difference of −1.57 percentage points with a 95% interval from −5.51 to +0.33. Framing A against B: 1.72% against 1.28%, +0.45 points, interval from −0.83 to +1.78. The plan expected this: the simulation gives framing A no advantage, and 163 holdout clients are too few to see a small effect.</p><p>Two panels use real public data and are labelled that way. REAL PUBLIC DATA: the Bank Marketing data set (Moro, Rita and Cortez 2014, CC BY 4.0) holds 41,188 phone contacts of a Portuguese bank from 2008 to 2010. In it the share of clients who say yes falls with every extra call, from 5.6% on the first to 2.4% on the fifth, and clients who said yes to the previous campaign said yes again 65.1% of the time, against 8.8% for clients never contacted before. That is why the banker in the second run gets one call, and only for clients who clicked. The data is old and from another market, so it backs patterns, never levels. The second panel compares the synthetic clients' incomes with the Czech Statistical Office's average wage.</p><p>The demo also includes a build spec for Salesforce Marketing Cloud Engagement and a map that sets the Mautic set-up beside that product row by row. Both are written from the vendor's public documentation. Nothing was built or run there, and I have no production experience with it, with Bloomreach or with Mautic. AI agents (Claude Code) wrote the code, the SQL and the first versions of the texts under my direction; I chose the campaign idea, the target rule and the A/B hypothesis from options the agents proposed.</p><h2>Limits and decisions</h2><ul><li><strong>Simulated, not a real campaign.</strong> The bank is made up, the clients are synthetic, and their behaviour and the size of the effect come from a simulator. The runs show the method and the machinery; they say nothing about how real clients behave.</li><li><strong>Both readings: not shown.</strong> Run 2 does not show that the campaign works or that one framing beats the other: both intervals include zero. The simulation gives framing A no advantage and the campaign only a small effect, which 163 holdout clients cannot show. Run 2 uses the same clients and random draws as run 1, so it is not an independent repeat, and the two are never pooled. The first demo's run is inconclusive by its own rule too.</li><li><strong>Mautic is a stand-in.</strong> Mautic is an open-source stand-in, neither Bloomreach nor Salesforce Marketing Cloud Engagement, and I have no production experience with any of the three. The build spec and the concept map for Marketing Cloud Engagement come from documentation: no account was opened, and the rows marked as inferred are an agent's reading, not the vendor's words.</li><li><strong>The client texts are agent drafts.</strong> The Czech e-mails, the push and the banker's note in the screenshots were drafted by AI agents. I have not edited them yet, so they are not my writing.</li><li><strong>Stubs and a missing channel.</strong> Push and the banker queue are local stubs; no provider was called. The first demo's in-app card has no channel in this Mautic set-up, so 133 clients in A or B got no message at all. Mautic ran on PHP's built-in server, which handles one request at a time: enough for one laptop, not for production.</li><li><strong>The demo clock skews some figures.</strong> One demo day lasts one minute, so the hour at which a push comes due is close to random. Two thirds of the pushes were held overnight in run 2, far more than a real bank would see. The 8 unsubscribes in A against 0 in B are noise on a small count: on 40,000 clients the same draws give 0.33% and 0.27%.</li><li><strong>The legal side is not checked by a lawyer.</strong> The consent and opt-out rules are built around Czech Act No. 480/2004, section 7, and GDPR Article 21, as read on 5 November 2026. No lawyer checked them; in a bank they would go to compliance first.</li></ul><h2>What's inside</h2><ul><li>The business case comes first</li><li>The target rule is easy to say and to check</li><li>Exclusions fail closed.</li><li>The groups are fixed before any message</li><li>First run, on paper (SIMULATED)</li><li>Opens mislead, and the report shows how (SIMULATED)</li></ul><p>Built with: SQL (SQLite), Python, Mautic, Claude Code</p><p><a href="/work/insurer-assistant/">Previous project: Insurance Assistant</a> · <a href="/work/audiovj/">Next project: AudioVJ</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20CRM%20Campaign">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
