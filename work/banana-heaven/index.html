    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Banana Party in Heaven</h1><p>Sixty beat-locked bananas, filmed by a self-directing camera</p><p>Real-time UE5 music-video mode: 60 cartoon bananas dance on the beat, filmed by a self-directing camera. Solo: concept, brief and direction; code written with AI agents. Result: a 40-second vertical reel.</p><p>A comedy music-video mode of AudioVJ's Sky scene in Unreal Engine 5: 60 cartoon bananas party on ray-marched clouds, each dancing its own loop scrubbed by the live beat clock, so every bounce lands on the beat at any tempo. The crowd follows the song's structure (a cheering wave on drops, crouch-and-shake through build-ups, phone lights in breakdowns) while an automatic crowd cam cuts on the beat, strobes, ramps into slow motion and dolly-zooms like phone footage from inside a rave. The runtime is custom C++ and HLSL, from a blueprint-free anim instance to procedural shader faces.</p><h2>What's inside</h2><ul><li>Beat-scrubbed animation</li><li>Blueprint-free C++ UAnimInstance</li><li>Auto-director crowd cam</li><li>Original procedural faces in HLSL</li><li>Wardrobe and recording</li></ul><p>Built with: Unreal Engine 5, C++, HLSL, Python, Blender, Rigify, Tripo, Kimodo, FFmpeg, PowerShell</p><p><a href="/work/av-control/">Previous project: AV Control</a> · <a href="/work/night-drive/">Next project: Undercover Ecstasy</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Banana%20Party%20in%20Heaven">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
