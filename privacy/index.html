    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/automation/">Automation</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>What this site does with your data</h1><p>In short: no cookies, no analytics, no trackers. YouTube loads only when you press play.</p><h2>Who runs this site</h2><p>This is the personal portfolio of Aspandiyar Kurman, who is responsible for it. For anything about your data, email the address below.</p><p><a href="mailto:aspandos140897@gmail.com">aspandos140897@gmail.com</a></p><h2>Hosting</h2><p>The site is a set of static files on GitHub Pages, with no server or database of its own. To deliver the pages, GitHub processes your IP address, under GitHub's own privacy statement.</p><p>Fonts, scripts, images and videos all come from this same address: no CDN, no Google Fonts. The one exception is the About page, which reads the latest Instagram follower count from a public file on GitHub (raw.githubusercontent.com), sent without cookies or a referrer, so GitHub sees that request too.</p><p><a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub Privacy Statement</a></p><h2>No cookies, no tracking</h2><p>The site sets no cookies and runs no analytics, tracking pixels, ads or fingerprinting. Its Content Security Policy lets a page load only the site's own files and the services named on this page.</p><h2>What stays in your browser</h2><p>One entry in localStorage, ak-hq-lang, remembers the language you picked (en or cs), so your next visit opens in it. It never leaves your browser; clearing this site's data removes it.</p><p>What you type into the message form stays in the page's memory until you reload or close it, so closing the form by mistake loses nothing. It is not saved anywhere.</p><h2>Loaded only after a click</h2><p>YouTube: the Final word page, and case studies with a Play with sound button, show only this site's own picture or muted loop at first. YouTube's player (youtube-nocookie.com) loads only when you press play; from then on Google processes your data under its own privacy policy.</p><p>Microphone: if you let the visuals react to your microphone, your browser asks first. The sound is analysed inside the page to move the visuals and is never recorded or sent.</p><p>Links to LinkedIn, Instagram, ArtStation, YouTube and other sites open those sites, under their own terms.</p><p><a href="https://policies.google.com/privacy">Google Privacy Policy</a></p><h2>Write email</h2><p>The Write email form sends nothing by itself: Send opens your own email app with the message filled in, and you send it from your own account. I use what you write only to reply.</p><h2>The automation demo</h2><p>The n8n automation demo is a separate site on its own server, not part of this one, and it has its own privacy notice.</p><p><a href="https://demo.169-58-113-159.sslip.io/soukromi">Demo privacy notice (in Czech)</a></p><h2>Your rights</h2><p>Under the GDPR you can ask what data about you I hold (in practice, only emails from you), have it corrected or deleted, get a copy, or object to its use. Write to the email above. You can also complain to the Czech data protection office, ÚOOÚ.</p><p><a href="https://uoou.gov.cz/">ÚOOÚ (uoou.gov.cz)</a></p><p>Updated 4 November 2026</p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%20enquiry">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
