    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Liquid / Obsidian Bloom</h1><p>Music drives ink, mercury, ferrofluid and an ocean</p><p>Four liquids react live to music, a gamepad and the singer's voice. Each averages 2.2–2.4 ms of GPU time and passed every automated check.</p><p>Four liquids react to music and a gamepad, linked by transitions under a second. In AudioVJ they form scene 6: ferrofluid, liquid chrome, a night ocean and the 'Obsidian Bloom' ink, which pours one layer per beat while a glowing stylus draws through the paint. The scene films its own 9:16 reels.</p><h2>What's inside</h2><ul><li>Hairline veins stay 1 px sharp at any distance and over-folded paint turns to black lacquer…</li><li>The ocean is three seamlessly tiling JONSWAP cascades (428 wave modes in the test run), three long…</li><li>Demucs-separated vocals feed a 100 fps sidecar</li><li>Every liquid passed its scripted 50 s gamepad test (pass/fail checks for GPU time, beat timing and…</li><li>Ferrofluid is a 768² GPU-displaced grid driven by CPU springs and a 240 Hz render-target ripple…</li></ul><p>Built with: Unreal Engine 5, HLSL, C++, Python, Demucs, PowerShell, FFmpeg</p><p><a href="/work/portfolio-site/">Previous project: Portfolio HQ</a> · <a href="/work/lyric-poster/">Next project: Lyric Poster</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Liquid%20%2F%20Obsidian%20Bloom">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
