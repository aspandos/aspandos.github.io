    <noscript><h1>Triad</h1><p>One music analysis, three apps, every frame in sync.</p><p>Triad is a pipeline I designed so TouchDesigner, Houdini and Unreal Engine 5.8 react to the same music. One Python analyzer runs live in TouchDesigner, which streams 65 OSC channels per frame (a 32-bin spectrum among them) into a custom Unreal C++ plugin; offline, the same code writes frame-exact 'takes' that drive Houdini simulations and Unreal renders. Two shots prove it: Endless Blossom, a procedural lotus that grows a petal on every beat and sheds a wave of Vellum-cloth petals on the drop, rendered from one Alembic in both Karma XPU and Unreal; and Sand Reformation, 250,126 Vellum grains poured on the kicks and played back in Unreal as GPU instances.</p></noscript>
