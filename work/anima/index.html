    <noscript><h1>Anima</h1><p>A flower that hears music: 262,144 GPU particles</p><p>Anima is a vertical 1080×1920, 60 fps music-reactive TouchDesigner piece: a real flower photo stays sharp only in selected cells of an 8×14 grid and everywhere else dissolves into hair, strands and dust from a 262,144-particle GPU simulation. Kicks, drops, vocals and the lead melody each drive their own layer, from live FFT detection in Python plus offline Demucs stem curves, while a virtual relief camera films the result through a Depth Anything V2 depth map. The whole network is generated from Python every time a 946-byte bootstrap .toe opens, it can be played live on an Xbox controller, and the 60 s reel was rendered offline frame by frame.</p></noscript>
