    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Pigeon</h1><p>A 2D pigeon illustration made into a 3D glass card</p><p>A 2D illustration from Instagram rebuilt in Blender as a glass Queen of Clubs card, rendered in Cycles, cut in DaVinci Resolve and run through TouchDesigner.</p><p>Pigeon takes a 2D pigeon illustration by @mutedspark_creates, posted on Instagram, and shows it in 3D. In Blender the picture sits inside a Queen of Clubs playing card set in a glass slab, and Cycles renders the card turning so the glass splits the light into colour. The renders were cut in DaVinci Resolve and run through TouchDesigner, where the song's level drives the edge and black-and-white effects.</p><h2>What's inside</h2><ul><li>The illustration (2480 × 3508 px) is an image texture on a plane inside a paper card with a notch…</li><li>The glass slab's material combines dispersion, thin-film and caustics shader groups, so its edges…</li><li>Cycles rendered the scene on the GPU at 1920 × 1920 with AgX High Contrast</li><li>The renders were cut in DaVinci Resolve (21.6 s at 24 fps).</li></ul><p>Built with: Blender, TouchDesigner</p><p><a href="/work/ks26-merch/">Previous project: KS26 Merch</a> · <a href="/work/dumb-head/">Next project: Dumb Head</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Pigeon">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
