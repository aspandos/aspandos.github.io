    <noscript><h1>Banana Party in Heaven</h1><p>Sixty beat-locked bananas, filmed by a self-directing camera</p><p>A comedy music-video mode of AudioVJ's Sky scene in Unreal Engine 5: 60 cartoon bananas party on ray-marched clouds, each dancing its own loop scrubbed by the live beat clock, so every bounce lands on the beat at any tempo. The crowd follows the song's structure (a cheering wave on drops, crouch-and-shake through build-ups, phone lights in breakdowns) while an automatic crowd cam cuts on the beat, strobes, ramps into slow motion and dolly-zooms like phone footage from inside a rave. The runtime is custom C++ and HLSL, from a blueprint-free anim instance to procedural shader faces.</p></noscript>
