    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>DLSS Render</h1><p>DLSS final renders in Blender: unblocked, then benchmarked</p><p>Unblocking DLSS for a third-party Blender add-on on the 5.3 beta, then benchmarking against Cycles. Aspandiyar directed; AI agents wrote the code. Result: frames hold up visually, but light scenes render slower.</p><p>DLSS Render is a free third-party add-on by Armin5D that saves final Cycles frames through the DLSS Ray Reconstruction denoiser in Blender 5.3's viewport. On the 5.3 beta, Cycles reported the RTX card as not DLSS-capable, so the work here was tracing why, fixing it without patching Blender, and building a Python harness that renders the same scenes both ways and scores speed and image quality against plain Cycles. The result so far, unvarnished: the DLSS frames hold up visually, but on light scenes the DLSS path is about 2× slower, and the heavy volumetric scene where it should pay off has no DLSS result yet.</p><h2>What's inside</h2><ul><li>Unblocked DLSS on the Blender 5.3 beta.</li><li>Like-for-like benchmark harness in Python/bpy. Scene prep puts both paths on equal terms</li><li>compare.py scores quality and speed</li><li>Measured on an RTX 5070 Ti</li><li>Second R&amp;D track</li></ul><p>Built with: Blender, Python, PyTorch, Kimodo</p><p><a href="/work/fish-weather/">Previous project: Fish Weather</a> · <a href="/work/audiovj/">Next project: AudioVJ</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20DLSS%20Render">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
