    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Portfolio HQ</h1><p>The site you are on: one portfolio that re-pitches itself for five roles</p><p>Bilingual React 19 + TypeScript portfolio that re-orders itself for five roles, ships a static page per route and runs on an audio-reactive background. Concept, direction and sign-off: Aspandiyar Kurman; code written with Claude Code.</p><p>Portfolio HQ is this site: a bilingual (EN/CZ) portfolio built with Vite 8, React 19, TypeScript and Tailwind CSS 4 and served by GitHub Pages at aspandos.github.io. A role lens re-orders every project for Game Dev, Frontend, Motion, Audio-reactive or AI Dev roles and travels in the link as ?for=; a build step writes a static HTML page per route with its own title, description and share image, and adds JSON-LD to the pages meant for search; a Ctrl/⌘K palette reaches every page; and a Web Audio engine (a generative synth or the visitor's microphone) drives the particle-ring background. It is built with Claude Code, Anthropic's AI coding agent, under my direction: I set the goals, the design direction, the content and the rules for what may be published; Claude Code writes the code and runs the checks (typecheck, production build, Lighthouse, visual checks at desktop and phone width); I review the results and sign off.</p><h2>What's inside</h2><ul><li>Role lens</li><li>A static page for every route</li><li>Sound you can see</li><li>Fast on phones</li><li>Checked before it ships</li><li>Same facts, many outputs</li></ul><p>Built with: Claude Code, TypeScript, React, Vite, Tailwind CSS, Three.js, HTML &amp; CSS, Git &amp; GitHub, Python, FFmpeg</p><p><a href="/work/audiovisualizer/">Previous project: AudioVisualizer</a> · <a href="/work/liquid/">Next project: Liquid / Obsidian Bloom</a>
