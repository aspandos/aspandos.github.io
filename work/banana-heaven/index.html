    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Banana Party in Heaven</h1><p>Sixty beat-locked bananas, a self-directing camera</p><p>A real-time music-video mode: cartoon bananas dance on the beat while the camera picks its own shots, finished as a 40-second vertical reel.</p><p>Banana Party in Heaven is a comedy music-video mode of AudioVJ's Sky scene. The cartoon bananas party on raymarched clouds, and every bounce lands on the beat at any tempo. The crowd follows the song's structure (a cheering wave on drops, crouch-and-shake through build-ups, phone lights in breakdowns) while an automatic crowd cam cuts on the beat, strobes, ramps into slow motion and dolly-zooms like phone footage from inside a rave.</p><h2>What's inside</h2><ul><li>The crowd stays in sync without moving in unison</li><li>Shy and wild dancers come from the same clips with no extra assets.</li><li>The crowd cam cuts between 7 shot types, each with its own FOV and f-stop.</li><li>The faces are original procedural HLSL, with 25 expression presets driven by 24 animated channels.</li><li>Hats, glasses, chains, bow ties, mustaches and sneakers are dealt so all 60 outfits differ; face…</li></ul><p>Built with: Unreal Engine 5, C++, HLSL, Python, Blender, Rigify, Tripo, Kimodo, FFmpeg, PowerShell</p><p><a href="/work/av-control/">Previous project: AV Control</a> · <a href="/work/night-drive/">Next project: Undercover Ecstasy</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Banana%20Party%20in%20Heaven">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
