    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Lead Intake</h1><p>A web form that sorts customer messages with AI</p><p>Companies get orders, complaints, questions and spam through their website. This n8n automation reads each message, sorts it by type and urgency, looks up the company by its ID number in the Czech business register and drafts a reply for the team to check. It runs on a server I rent in the EU, and you can try it now.</p><p>A live demo: write to a made-up company as a customer and see within seconds how n8n and Claude sort your message.</p><h2>How it works</h2><p>A visitor writes a message in a web form. n8n, an automation tool, checks it, looks the company up in ARES, the Czech public business register, when the visitor gives its ID number (IČO), and asks Claude Haiku, an AI model from Anthropic, to sort the message: its type and priority, a one-line summary and a draft reply. Claude has to answer in a fixed format (a JSON schema), so the workflow can check the answer. The result shows on the next screen and stays in a table in n8n for 7 days; a copy without the message text goes to two Google Sheets files. Along the way the workflow calls the public ARES REST API, Anthropic's Messages API, Google Sheets through a service account and, in the local build, Salesforce.</p><p>If Claude fails, answers in the wrong format or the daily cap of 150 AI calls is used up, fixed rules sort the message instead, and the cap also limits the cost. A separate error workflow catches failures, and if a Google Sheets write fails, the message is kept and an alert row appears in n8n. The demo runs in Docker on a rented server in the EU, behind an nginx reverse proxy that lets only the demo's own pages through to the internet.</p><p>Each decision also gets a receipt that says whether Claude or the rules sorted the message, with the type and priority but no message text. Every hour a scheduled job links the receipts of each finished day into a chain of SHA-256 hashes (digital fingerprints), so a later change to any receipt would show. The /overeni page recomputes that chain right in the browser.</p><p>117 unit tests run before every deployment. Twelve sample messages, including spam and a prompt injection (a message that tries to slip its own instructions to the AI), go through the workflow on a local copy of n8n, from the check and the ARES lookup to sorting by the fixed rules, with no AI call.</p><p>To measure the AI step, 40 made-up test messages with checked labels went through the workflow twice: once sorted by Claude Haiku, once by the fixed rules. Claude put all 40 in the right category and got both category and priority right for 36. The rules got the category right for 24, and category and priority together also for 24; they missed most spam, including a prompt injection they filed as an urgent complaint. One message cost about $0.0002. Claude Code wrote the test messages, to the same definitions the prompt uses, and the test ran once with no repeats, so real mail may score lower.</p><p>The local build also hides personal details before a message reaches Claude, with the personal-data filter from the Insurance Assistant project: Claude reads stand-ins such as [jméno A] instead of names, phone numbers and addresses. The public demo does not have the filter, so there the message goes to Claude Haiku as written. On five sets of made-up messages, each read only after that round's rules were final, the filter hid 74% of the details on the first set and 93.8% on the fifth. On 11 Nov the insurer filter's newest rules were copied in, and sets 1 to 5 gave the same results, message by message. A sixth set came from a different model, Gemma 4 12B, which saw neither the filter nor the earlier sets: 39 messages with 125 personal details and 44 business words that must stay readable, in Czech, English, German, Slovak and mixed. The filter hid 103 of the 125 (82.4%; 102 with the older rules) and wrongly hid 2 of the 44 business words. Nobody checked that set's labels by hand, and its messages are harder than sets 1 to 5, so it is a stricter outside check, not a drop.</p><p>In the local build each stored message also becomes a Lead, Salesforce's record of a possible customer, in a Developer Edition org, created by n8n's Salesforce node. The Lead holds the receipt number, the firm and its address from ARES, the source, a status and a rating from the priority, but never the name, e-mail or message text. If Salesforce refuses a Lead, n8n adds an alert row and the rest of the run goes on. A Workato recipe (Free plan) watches the same org and gives every Hot web Lead a follow-up task due the next day; Leads with another rating start no job.</p><p>The demo's logic is written in JavaScript and the scheduled job in Python. AI coding agents (Claude Code) write the code in my projects under my direction; the brief, workflow design, test criteria, review and sign-off are mine.</p><h2>Limits and decisions</h2><ul><li><strong>The customer never gets AI text.</strong> Claude writes only a reply draft for the team to review. The local build's confirmation e-mail to the customer is fixed text that never quotes the message, so the form cannot relay spam.</li><li><strong>The Gmail branch is not tested end to end.</strong> The local build can store messages in Google Sheets and send the e-mails through Gmail. That branch is built and its report logic has unit tests, but it has not run end to end yet, and none of it is on the public server.</li><li><strong>Salesforce stays in the local build.</strong> On the server it would need a privacy-notice passage naming Salesforce as a processor, a 7-day clean-up of the Leads, and a sign-in with a certificate instead of OAuth, because the OAuth sign-in's browser redirect cannot pass nginx.</li><li><strong>The personal-data filter is local only.</strong> The public server runs without it, so there the message goes to Claude as written. The filter also lets details through: on the sixth set it missed, among others, a kidney problem, a Slovak word for a religion, membership of a craftsmen's union, a bank debt, an income with no cue word and a Slovak name written in lower case.</li><li><strong>No message text in Google Sheets.</strong> Google keeps deleted rows in a file's version history for as long as the file exists, so the 7-day clean-up could not remove a message there. The sheets get the category, priority and receipt number, not the visitor's words. The demo also uses a free Google account, which has no data processing agreement; a client would use Google Workspace with Google's DPA.</li><li><strong>No CAPTCHA yet.</strong> The public server has per-address rate limits in nginx and a daily cap on AI calls. A CAPTCHA, and a per-address limit on the local build's customer confirmations, are not built; a company going live would need them.</li></ul><h2>What's inside</h2><ul><li>The public form asks for a message, an optional company ID (IČO) and consent, never a name or…</li><li>Claude Haiku sorts each message in one Messages API call that must answer in a fixed JSON schema…</li><li>The visitor's text sits inside &lt;inquiry&gt; tags, is marked as data in the prompt and has its own…</li><li>Costs are capped at 150 AI calls a day.</li><li>Only the demo's own pages are reachable from the internet</li><li>Every stored message also gets a receipt with its number and time, Claude or the rules (and why)…</li></ul><p>Built with: n8n, Claude API, Salesforce, Workato, JavaScript, Python, Docker, Claude Code</p><p><a href="/work/portfolio-site/">Previous project: Portfolio HQ</a> · <a href="/work/insurer-assistant/">Next project: Insurance Assistant</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Lead%20Intake">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
