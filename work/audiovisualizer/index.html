    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>AudioVisualizer</h1><p>Eighteen GPU worlds that find the drop themselves</p><p>A TouchDesigner music visualizer: 18 GLSL worlds follow spectrum and kick; an auto director spots drops and switches style. Solo concept and direction, code written with AI agents; result: five vertical reels.</p><p>A live music visualizer built in TouchDesigner: audio from a file or live input becomes a 256-bin spectrum, low/mid/high bands and kick detection that drive 18 GPU-shaded styles at 1920×1080, from a hyperbolic Circle Limit floor and a Gothic rose window to 4,000 strange-attractor threads and a 65,000-domino cascade. An auto director spots breakdowns, build-ups and drops and switches style, camera and colour by itself, while Kinect gestures, MIDI and a phone panel let a performer steer it live. Its finished output is Anthropology, a five-reel vertical series (1080×1920, 60 fps) rendered with the same system.</p><h2>What's inside</h2><ul><li>Code-first TouchDesigner</li><li>About 15,300 lines of GLSL in 96 shader files, built on exact maths</li><li>Music-structure logic</li><li>Local GPU AI lyric pipeline in a separate WebSocket worker</li><li>Built for stage and delivery</li></ul><p>Built with: TouchDesigner, GLSL, Python, JavaScript, WebSocket, HTML &amp; CSS, Demucs, Whisper, Kinect, MIDI, FFmpeg, Depth Anything</p><p><a href="/work/perspectiva/">Previous project: Perspectiva</a> · <a href="/work/portfolio-site/">Next project: Portfolio HQ</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20AudioVisualizer">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
