    <noscript><h1>AV Control</h1><p>A phone VJ panel that builds itself from TouchDesigner</p><p>AV Control is the phone and laptop control surface for my TouchDesigner AudioVisualizer: about 3,100 lines of plain HTML, CSS and JavaScript with no framework or build step, served by TouchDesigner's own web server. On connect it receives the parameter schema, builds all 255 web-exposed controls from it, then stays in sync over one WebSocket carrying ~30 Hz audio levels, state changes and a binary JPEG preview. It covers a whole live set (style tiles, auto director, Kinect body control, MIDI learn, presets, lyric tap-sync, recording), and a standard-library Python mock server lets the panel be developed without TouchDesigner.</p></noscript>
