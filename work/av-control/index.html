    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>AV Control</h1><p>Phone VJ panel that builds itself from TouchDesigner</p><p>A phone panel for playing live visuals to music: it builds its 255 web-exposed controls from TouchDesigner's schema and runs a whole live set over one WebSocket.</p><p>AV Control is the phone and laptop control surface for my TouchDesigner AudioVisualizer. It covers style tiles, the auto director, Kinect body control, MIDI learn, presets, lyric tap-sync and recording. The panel is about 3,100 lines of plain HTML, CSS and JavaScript with no framework or build step, served by TouchDesigner's own web server.</p><h2>What's inside</h2><ul><li>A parameter added to params.json appears with no front-end change</li><li>Slider sends are throttled on timers, not requestAnimationFrame, so dimmed phones and background…</li><li>Canvas 2D draws a peak-hold spectrum on the shader's log curve and a 10-joint Kinect stick figure…</li><li>MIDI learn arms any control tagged data-learn, a whole menu or a single entry, through a…</li><li>Phones get a bottom tab bar with safe-area insets, screens from 900 px two columns.</li></ul><p>Built with: JavaScript, WebSocket, HTML &amp; CSS, Canvas 2D, TouchDesigner, Python, MIDI, Kinect</p><p><a href="/work/triad/">Previous project: Triad</a> · <a href="/work/banana-heaven/">Next project: Banana Party in Heaven</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20AV%20Control">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
