    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/automation/">Automation</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Dumb Head</h1><p>A sculpted head, optimized and baked</p><p>A stylized head: sculpted in Blender, cut from 953,592 to 7,604 faces, then baked and textured in Substance 3D Painter.</p><p>Dumb Head is a stylized head sculpted in Blender. The 953,592-face sculpt was retopologised to 7,604 faces, its detail baked into texture maps in Substance 3D Painter, and the head textured there.</p><h2>What's inside</h2><ul><li>The head was sculpted in Blender in one recorded session on 3 June 2026, from the first block-out…</li><li>In the same session it was retopologised to 7,604 quads (15,208 triangles), 125 times fewer faces…</li><li>Both meshes went to Substance 3D Painter, which baked the sculpt's detail into 4096 × 4096 maps…</li><li>The hat is a separate low-poly model (2,432 faces) with its own Substance 3D Painter file.</li></ul><p>Built with: Blender, Substance 3D Painter</p><p><a href="/work/pigeon/">Previous project: Pigeon</a> · <a href="/work/fish-weather/">Next project: Fish Weather</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Dumb%20Head">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
