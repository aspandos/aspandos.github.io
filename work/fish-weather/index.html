    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist <nav><a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Fish Weather</h1><p>Six weathers, one timeline, all cued to the music</p><p>A rigged fish walks a tiny planet through six weathers timed to music: a 60-second vertical reel, plus a game-ready 33-bone skeleton for Unreal.</p><p>A rigged fish in sneakers walks a tiny planet from sunrise to a starry night. Wind, rain, a thunderstorm and snow come in between, each act timed to the song's vocal phrases, with lightning and camera cuts on the beat. Python builds the whole scene in Blender around one keyframed timeline.</p><h2>What's inside</h2><ul><li>One timeline drives every weather change</li><li>The fish walks in place while the planet rolls under it at its stride speed, so the feet don't…</li><li>A Mantaflow gas domain of negative-buoyancy fog treats the walking fish as a moving obstacle, so…</li><li>The restyle made the walk measurably smoother</li><li>The FBX-driven mesh matches the original control rig within 0.002 cm per vertex</li></ul><p>Built with: Blender, Python, Geometry Nodes, Tripo, Unreal Engine 5, FFmpeg, PowerShell</p><p><a href="/work/night-drive/">Previous project: Undercover Ecstasy</a> · <a href="/work/dlss-render/">Next project: DLSS Render</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20Fish%20Weather">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a></p></noscript>
