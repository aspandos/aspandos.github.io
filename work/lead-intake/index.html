    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/work/">Work</a> · <a href="/gallery/">Gallery</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>Lead Intake</h1><p>Lead sorting in n8n</p><p>I run a working n8n automation on a rented server in the EU, and you can try it right away. It checks a message from a web form, looks up the company by its ID number (IČO) in the Czech ARES register, uses Claude to sort the message by type and priority, and drafts a reply for the team.</p><p>A live n8n demo that sorts customer messages with Claude.</p><h2>How it works</h2><p>The workflow connects several apps and cloud services through their APIs: the public REST API of the ARES register, Anthropic's Messages API, Google Sheets with a service account and, in the local build, Salesforce. The request to Claude is built from the message and the ARES data, and Claude's answer has to fit a fixed JSON schema. The result is stored in a table in n8n and also, without the message text, in two Google Sheets files. A scheduled job runs every hour, and once a day has ended it calls a webhook that links that day's decision records into a chain of SHA-256 hashes; the /overeni check page recomputes that chain right in the browser.</p><p>The logic is covered by 117 unit tests that run before every deployment. Twelve sample messages, including spam and a prompt injection attempt, go through the workflow on a local n8n instance, from the check and the ARES lookup to sorting by the fixed rules, with no AI call. A daily cap of 150 AI calls limits the cost. If Claude fails, gives an answer that does not fit the schema, or the cap is used up, the fixed rules sort the message instead. A separate error workflow catches failures. If saving to Google Sheets fails, the message is not lost and an alert row appears in n8n. The demo runs in Docker behind an nginx reverse proxy that makes only the demo's own pages reachable from the internet.</p><p>To measure the AI step, 40 made-up test messages with checked labels went through the workflow twice, once sorted by Claude Haiku and once by the fixed rules. Claude put all 40 in the right category and got both category and priority right for 36; the rules got the category right for 24, and category and priority together also for 24, and missed most spam, including a prompt injection they filed as an urgent complaint. One message cost about $0.0002. Claude Code wrote the messages for the test, to the same definitions the prompt uses, and the test ran once with no repeats, so real mail may score lower.</p><p>In the local build each stored message also becomes a Lead in a Salesforce Developer Edition org, created by n8n's Salesforce node. The Lead holds the receipt number, the firm and its address from ARES, the source, a status and a rating from the priority, but never the name, e-mail or message text. If Salesforce refuses a Lead, n8n adds an alert row and the rest of the run goes on. A Workato recipe (Free plan) watches the same org and gives every Hot web Lead a follow-up task due the next day; Leads with another rating start no job.</p><p>The demo's logic is written in JavaScript and the scheduled job in Python. AI coding agents (Claude Code) write the code in my projects under my direction; the brief, workflow design, test criteria, review and sign-off are mine.</p><h2>Limits and decisions</h2><ul><li><strong>The customer never gets AI text.</strong> Claude writes only a reply draft for the team to review. The local build's confirmation e-mail to the customer is fixed text that never quotes the message, so the form cannot relay spam.</li><li><strong>The Gmail branch is not tested end to end.</strong> The local build can store messages in Google Sheets and send the e-mails through Gmail. That branch is built and its report logic has unit tests, but it has not run end to end yet, and none of it is on the public server.</li><li><strong>Salesforce stays in the local build.</strong> On the server it would need a privacy-notice passage naming Salesforce as a processor, a 7-day clean-up of the Leads, and a sign-in with a certificate instead of OAuth, because the OAuth sign-in's browser redirect cannot pass nginx.</li><li><strong>No message text in Google Sheets.</strong> Google keeps deleted rows in a file's version history for as long as the file exists, so the 7-day clean-up could not remove a message there. The sheets get the category, priority and receipt number, not the visitor's words. The demo also uses a free Google account, which has no data processing agreement; a client would use Google Workspace with Google's DPA.</li><li><strong>No CAPTCHA yet.</strong> The public server has per-address rate limits in nginx and a daily cap on AI calls. A CAPTCHA, and a per-address limit on the local build's customer confirmations, are not built; a company going live would need them.</li></ul><h2>What's inside</h2><ul><li>The public form asks for a message, an optional company ID (IČO) and consent, never a name or…</li><li>Claude Haiku sorts each message in one Messages API call that must answer in a fixed JSON schema…</li><li>The visitor's text sits inside &lt;inquiry&gt; tags, is marked as data in the prompt and has its own…</li><li>Costs are capped at 150 AI calls a day.</li><li>Only the demo's own pages are reachable from the internet</li><li>Every stored message also gets a receipt with its number and time, Claude or the rules (and why)…</li></ul><p>Built with: n8n, Claude API, Salesforce, Workato, JavaScript, Python, Docker, Claude Code</p><p><a href="/work/portfolio-site/">Previous project: Portfolio HQ</a> · <a href="/work/insurer-assistant/">Next project: Insurance Assistant</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%
