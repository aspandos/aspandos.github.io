<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumb Head</title>
  <!-- The page's look (colors, sizes) lives in style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- An empty box at the top of the page. main.js draws the animated title into it. -->
  <div id="title"></div>

  <!-- Tell the browser where to download Three.js from -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <!-- All the 3D code lives in main.js -->
  <script type="module" src="main.js"></script>
</body>
</html>
