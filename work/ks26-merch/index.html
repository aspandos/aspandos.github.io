    <noscript><header><a href="/">Aspandiyar Kurman</a> · Creative Technologist · AI Automation <nav><a href="/automation/">Automation</a> · <a href="/assistant/">Assistant</a> · <a href="/crm/">CRM</a> · <a href="/work/">Work</a> · <a href="/tools/">Toolkit</a> · <a href="/about/">About</a> · <a href="/cv/">CV</a> · <a href="/contact/">Contact</a></nav></header><main><h1>KS26 Merch</h1><p>Merch for a real musician</p><p>Front and back prints for Kubson Spur's limited KS26 shirt: a 3D skull painted by hand in Blender, and KS letters textured in Substance 3D Painter.</p><p>KS26 is a limited-edition merch T-shirt for guitarist Kubson Spur. The front print is a 3D skull painted by hand in Blender and set in fire; the back carries the KS letters, modelled from a hand-drawn sketch and textured in Substance 3D Painter.</p><h2>What's inside</h2><ul><li>The skull (a BlenderKit model, 52,657 faces) is painted by hand in Blender's Texture Paint mode…</li><li>Blender kept crashing, so the skull was saved under new names and recorded across eight sessions…</li><li>Blender Studio's Brushstroke Tools lay painterly strokes over the skull, and 16 fire planes around…</li><li>The KS letters began as a hand-drawn sketch, traced into a Blender mesh on 19 September 2025 and…</li></ul><p>Built with: Blender, Substance 3D Painter</p><p><a href="/work/lyric-poster/">Previous project: Lyric Poster</a> · <a href="/work/pigeon/">Next project: Pigeon</a> · <a href="/work/">All projects</a></p></main><p><a href="mailto:aspandos140897@gmail.com?subject=Portfolio%3A%20KS26%20Merch">aspandos140897@gmail.com</a> · <a href="https://www.linkedin.com/in/aspandiyar-kurman-6ba43b127/">LinkedIn</a> · <a href="https://www.artstation.com/aspandos">ArtStation</a> · <a href="https://www.instagram.com/aspandos0/">Instagram</a></p></noscript>
