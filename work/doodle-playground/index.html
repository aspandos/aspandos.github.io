    <noscript><h1>Doodle Playground</h1><p>Scribbles that boil, bounce, walk and export to 9:16</p><p>Doodle Playground is a no-build browser toy in one vanilla JavaScript file: every stroke is stored as points and re-displaced with smooth value noise about nine times a second, which gives it the hand-drawn &quot;line boil&quot; of 2D cartoons. Strokes group into doodles that dance, bounce with squash and stretch, float or walk on a small hand-written physics system, and in 9:16 mode a hidden 1080×1920 canvas records 6-second clips through MediaRecorder. Two sibling apps share the same skateboarding cat: Reel Maker, a deterministic seamless-loop Reels renderer, and Dumb Head, the Three.js scene the cat comes from, where a head follows the cursor and watches the cat.</p></noscript>
