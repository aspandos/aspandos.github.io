    <noscript><h1>Lyric Poster</h1><p>Song in, Swiss-poster lyric reel out, every word frame-exact</p><p>A reusable TouchDesigner tool: give it a song, its timed lyrics and a folder of public-domain oil paintings, and it renders a 1080×1920, 60 fps lyric reel in Swiss-poster style (4:5, 1:1 and 16:9 layouts too). Offline numpy analysis builds a drift-corrected beat grid, a per-song JSON plan directs every section, and each frame composites a depth-relief ASCII painting world with a shader-drawn Anton type layer that re-flows on the beat. Automated QC proves the timing: in the two delivered reels, 168 of 168 and 41 of 41 words appear on their exact start frame.</p></noscript>
